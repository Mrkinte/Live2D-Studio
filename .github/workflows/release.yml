name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        shell: bash
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::标签 ${GITHUB_REF_NAME} 与 pyproject 版本 ${version} 不一致"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        packager: [pyinstaller, nuitka]
    env:
      LIVE2D_STUDIO_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen --no-dev
      - name: Install Nuitka
        if: matrix.packager == 'nuitka'
        run: uv pip install "nuitka>=2.6"
      - name: Install UPX
        if: matrix.packager == 'pyinstaller'
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build with PyInstaller
        if: matrix.packager == 'pyinstaller'
        run: uv run --frozen pyinstaller --noconfirm --clean live2d-studio.spec
      - name: Build with Nuitka
        if: matrix.packager == 'nuitka'
        shell: pwsh
        run: |
          uv run --no-sync python -m nuitka `
            --standalone `
            --enable-plugin=pyside6 `
            --windows-console-mode=disable `
            --windows-icon-from-ico=assets/live2d-studio.ico `
            --company-name=Mrkinte `
            --product-name="Live2D Studio" `
            --file-version=${{ needs.meta.outputs.version }}.0 `
            --product-version=${{ needs.meta.outputs.version }}.0 `
            --output-dir=dist/nuitka `
            --output-filename="Live2D Studio.exe" `
            --include-package-data=live2d `
            --include-data-files=src/live2d_studio/assets/live2d-studio.ico=live2d_studio/assets/live2d-studio.ico `
            --nofollow-import-to=numpy `
            --nofollow-import-to=PIL `
            --nofollow-import-to=scipy `
            --nofollow-import-to=pandas `
            --nofollow-import-to=tkinter `
            --nofollow-import-to=unittest `
            --nofollow-import-to=pytest `
            --noinclude-qt-translations `
            --assume-yes-for-downloads `
            --remove-output `
            run_studio.py
      - name: Package
        shell: pwsh
        env:
          PACKAGER: ${{ matrix.packager }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          if ($env:PACKAGER -eq 'pyinstaller') {
            $source = (Resolve-Path 'dist/Live2DStudio').Path
          } else {
            $dist = Get-ChildItem 'dist/nuitka' -Directory -Filter '*.dist' | Select-Object -First 1
            if (-not $dist) { throw '未找到 Nuitka 产物目录' }
            $source = $dist.FullName
          }
          $archive = "dist/Live2D-Studio-$env:VERSION-windows-x64-$env:PACKAGER.zip"
          Compress-Archive -Path (Join-Path $source '*') -DestinationPath $archive -CompressionLevel Optimal
          $raw = [long]((Get-ChildItem $source -Recurse -File | Measure-Object Length -Sum).Sum)
          $zipped = [long](Get-Item $archive).Length
          "$env:PACKAGER`t$raw`t$zipped" | Set-Content "dist/size-$env:PACKAGER.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Live2D-Studio-${{ matrix.packager }}
          path: |
            dist/Live2D-Studio-${{ needs.meta.outputs.version }}-windows-x64-${{ matrix.packager }}.zip
            dist/size-${{ matrix.packager }}.txt
          if-no-files-found: error

  release:
    needs: [meta, build]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Build release notes
        shell: bash
        run: |
          python3 - "${{ needs.meta.outputs.version }}" <<'PY' > notes.md
          import sys
          from pathlib import Path

          version = sys.argv[1]
          rows = []
          for path in sorted(Path("dist").glob("size-*.txt")):
              name, raw, zipped = path.read_text().strip().split("\t")
              rows.append(
                  f"| {name} | {int(raw) / 1048576:.1f} MiB | {int(zipped) / 1048576:.1f} MiB |"
              )
          print(f"Live2D Studio v{version}（Windows x64）")
          print()
          print("| 打包器 | 解压后 | zip |")
          print("| --- | ---: | ---: |")
          print("\n".join(rows))
          print()
          print("解压后运行 `Live2D Studio.exe`。")
          PY
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.meta.outputs.version }}" dist/*.zip \
            --title "v${{ needs.meta.outputs.version }}" \
            --notes-file notes.md \
            --repo "$GITHUB_REPOSITORY"
